<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Admin</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tdokuihifeihuuiaabsk.supabase.co; connect-src https://tdokuihifeihuuiaabsk.supabase.co; media-src https://tdokuihifeihuuiaabsk.supabase.co; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<script src="guard.js"></script>
<link rel="stylesheet" href="style.css">
<style>.lslip{display:inline-block;vertical-align:top;box-sizing:border-box;width:48%;margin:0 1% 10px 0;padding:10px;border:1px dashed #000;break-inside:avoid;font-size:14px}#slips{display:none}@media print{body.ps>*:not(#slips){display:none!important}body.ps #slips{display:block}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>
<section id="vLogin" class="login hide">
  <div class="logo"></div><h1 class="school"></h1><p class="mute">Teacher / admin sign in</p>
  <div class="card">
    <label for="u">Username</label><input id="u" autocapitalize="none">
    <label for="p">Password</label><div class="pw"><input id="p" type="password"><button type="button" class="alt sm" id="sp">Show</button></div><div class="row" style="margin-top:6px;gap:8px"><button type="button" class="alt sm" id="pwBack">Delete last</button><button type="button" class="alt sm" id="pwClear">Clear all</button></div>
    <p class="err" id="lerr"></p><button id="bLogin" style="width:100%">Sign in</button>
  </div>
</section>

<div id="vApp" class="hide">
  <header class="top"><button id="bBack" class="hide" aria-label="Go back" style="font-size:1.4rem;padding:4px 12px">←</button><div class="logo"></div><div class="t"><b class="school"></b><small>Admin</small></div>
    <button class="themebtn" aria-label="Change look">🎨</button><button id="bOut">Sign out</button></header>
  <nav class="tabs" id="tabs">
    <button data-t="bank">Questions</button><button data-t="upload">Upload</button><button data-t="exams">Exams</button>
    <button data-t="students">Students</button><button data-t="results">Results</button><button data-t="materials">Materials</button><button data-t="activity">Sign-ins</button><button data-t="messages">Messages</button><button data-t="backup">Backup</button>
  </nav>
  <main class="wrap" id="main"></main>
</div>
<div id="slips"></div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tdokuihifeihuuiaabsk.supabase.co; connect-src https://tdokuihifeihuuiaabsk.supabase.co; media-src https://tdokuihifeihuuiaabsk.supabase.co; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<script src="guard.js"></script>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<!-- LOGIN -->
<section id="vLogin" class="login hide">
  <div class="logo"></div>
  <h1 class="school"></h1>
  <p class="mute motto"></p>
  <div class="card">
    <label for="u">Username / Student ID</label><input id="u" autocomplete="username" autocapitalize="none">
    <label for="p">Password</label><div class="pw"><input id="p" type="password" autocomplete="current-password"><button type="button" class="alt sm" id="sp">Show</button></div><div class="row" style="margin-top:6px;gap:8px"><button type="button" class="alt sm" id="pwBack">Delete last</button><button type="button" class="alt sm" id="pwClear">Clear all</button></div>
    <p class="err" id="lerr"></p>
    <button id="bLogin" style="width:100%">Sign in</button>
  </div>
  <p style="text-align:center;margin:0 0 12px"><button type="button" class="alt sm" id="bForgot">Forgot password?</button></p>
  <div class="card hide" id="fp"><h3>Forgot your password?</h3>
    <p class="mute">Enter your username. Your teacher will get your request and give you a new password.</p>
    <label for="fu">Username</label><input id="fu" autocapitalize="none">
    <button id="bReq" style="width:100%;margin-top:10px">Send request</button><p id="fmsg" class="mute"></p></div>
  <p style="text-align:center"><button class="alt sm themebtn">Light / dark</button></p>
</section>

<!-- APP -->
<div id="vApp" class="hide">
  <header class="top">
    <div class="logo"></div>
    <div class="t"><b class="school"></b><small id="who"></small></div>
    <button class="themebtn">◐</button><button id="bOut">Sign out</button>
  </header>
  <main class="wrap" id="main"></main>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
